app:
  description: 'Automatic HKUST mailbox assistant: device-code sign-in, S/A/B/C classification, category write-back, daily/weekly HTML reports and a manual sum report, all in one Dify workflow.'
  icon: 📬
  icon_background: '#FFEAD5'
  mode: workflow
  name: HKUST_AI_email_manager
  use_icon_as_answer_icon: false
dependencies: []
kind: app
version: 0.5.0
workflow:
  conversation_variables: []
  environment_variables:
  - id: env-email
    name: EMAIL
    value_type: string
    value: CHANGE_ME@connect.ust.hk
    description: ''
  - id: env-name
    name: NAME
    value_type: string
    value: ''
    description: ''
  - id: env-student_id
    name: STUDENT_ID
    value_type: string
    value: ''
    description: ''
  - id: env-school_domains
    name: SCHOOL_DOMAINS
    value_type: string
    value: ust.hk
    description: ''
  - id: env-faculty
    name: FACULTY
    value_type: string
    value: ''
    description: ''
  - id: env-courses
    name: COURSES
    value_type: string
    value: ''
    description: ''
  - id: env-dorm_keywords
    name: DORM_KEYWORDS
    value_type: string
    value: UG Hall, UGHall, UGHousing, Hall, 宿舍, 宿生, Student Housing, Residence, Dorm
    description: ''
  - id: env-urgent_days
    name: URGENT_DAYS
    value_type: number
    value: 14
    description: ''
  - id: env-catchup_days
    name: CATCHUP_DAYS
    value_type: number
    value: 7
    description: ''
  - id: env-summary_days
    name: SUMMARY_DAYS
    value_type: number
    value: 7
    description: ''
  - id: env-recipient
    name: RECIPIENT
    value_type: string
    value: CHANGE_ME@connect.ust.hk
    description: ''
  - id: env-language
    name: LANGUAGE
    value_type: string
    value: zh
    description: ''
  - id: env-dry_run
    name: DRY_RUN
    value_type: string
    value: 'true'
    description: ''
  - id: env-tenant
    name: TENANT
    value_type: string
    value: common
    description: ''
  - id: env-client_id
    name: CLIENT_ID
    value_type: string
    value: ''
    description: ''
  - id: env-letters
    name: LETTERS
    value_type: string
    value: sabc
    description: ''
  - id: env-force_action
    name: FORCE_ACTION
    value_type: string
    value: auto
    description: ''
  features:
    file_upload:
      enabled: false
      allowed_file_extensions: []
      allowed_file_types:
      - image
      - document
      allowed_file_upload_methods:
      - local_file
      - remote_url
      max_file_upload_limit: 5
      number_limits: 1
    opening_statement: ''
    retriever_resource:
      enabled: false
    sensitive_word_avoidance:
      enabled: false
    speech_to_text:
      enabled: false
    suggested_questions: []
    suggested_questions_after_answer:
      enabled: false
    text_to_speech:
      enabled: false
