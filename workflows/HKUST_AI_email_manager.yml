          \ when present; never mention the level or the sender; \"\n                  \"no filler; at most about 40 words per line.\\n\"\n                  \"Output ONE JSON object: {\\\"points\\\": [ ... ]} with exactly %d strings, same order as the emails.\\n\\n\" % len(items)\n                  + \"\\n\\n\".join(blocks))\n    else:\n        prompt = (\"给下面每封邮件写一句中文要点（说清：这封邮件是什么、要我做什么）。\\n\"\n                  \"要求：有截止时间/日期/课程代号/金额/地点/材料就写进去；不要写级别和发件人；不要写废话；每封一句，约 40 字。\\n\"\n                  \"只输出一个 JSON 对象：{\\\"points\\\": [...]}，按顺序每封一个字符串，数量必须正好 %d 个。\\n\\n\" % len(items)\n                  + \"\\n\\n\".join(blocks))\n    return {\"prompt\": prompt, \"item_count\": len(items), \"has_items\": bool(items)}\n"
