version: 0.1.4
type: plugin
author: MiKasss666
name: email_manager
label:
  en_US: Email Manager
  zh_Hans: 邮件管理器
description:
  en_US: Microsoft Graph mailbox tools for the AI Email Manager Dify workflow - device-code sign-in, classified write-back, watcher state and HTML reports.
  zh_Hans: AI 邮件管理器 Dify 工作流用的 Microsoft Graph 邮箱工具：设备码登录、分级写回、监听状态与 HTML 报告。
icon: icon.svg
icon_dark: icon.svg
resource:
