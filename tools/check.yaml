identity:
  name: check
  display_name: "Check"
  author: mikasss666
  label:
    en_US: "Check"
    zh_Hans: "自检"
description:
  human:
    en_US: "Read-only self check: credential, Microsoft account, inbox size, Outlook categories."
    zh_Hans: "Read-only self check: credential, Microsoft account, inbox size, Outlook categories."
  llm: "Read-only self check: credential, Microsoft account, inbox size, Outlook categories."
parameters:
output_schema:
  type: object
  properties:
    success:
      type: boolean
      description: "True when the tool finished"
    signed_in:
      type: boolean
      description: "True when signed in"
    account:
      type: string
      description: "Signed-in Microsoft account"
    display_name:
      type: string
      description: "Display name"
    inbox_count:
      type: number
      description: "Messages in the inbox"
    token_expires_in:
      type: number
      description: "Seconds until the access token expires"
    last_signed_in_at:
      type: string
      description: "Local timestamp of the last successful sign-in"
    missing_categories_json:
      type: string
      description: "Required Outlook categories that are missing (JSON array)"
    categories_message:
      type: string
      description: "Human-readable category hint"
    error:
      type: string
      description: "Why the tool stopped, empty on success"
extra:
  python:
    source: tools/check.py
